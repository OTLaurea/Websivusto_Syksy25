<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop05</title>
    <style>
        .responsive-container {
      display: flex;
      flex-wrap: wrap;
    }
    
        .column {
      flex: 1;
      padding: 10px;
    }
    
        @media (max-width: 600px) {
      .column {
        flex: 100%;
      }
    }
        .responsive-image {
      max-width: 100%;
      height: auto;
    }
        .media-query-box {
      padding: 20px;
      text-align: center;
    }
    
        @media (max-width: 600px) {
      .media-query-box {
        background-color: lightcoral;
      }
    }
    
        @media (min-width: 601px) {
      .media-query-box {
        background-color: lightblue;
      }
    }
        .responsive-nav .nav-list {
      display: flex;
      list-style: none;
    }
    
        @media (max-width: 600px) {
      .responsive-nav .nav-list {
        display: none;
      }
    
      .responsive-nav .menu-toggle {
        display: block;
      }
    }
    </style>
</head>

<body>
    <div class="responsive-container">
      <div class="column">Column 1</div>
      <div class="column">Column 2</div>
    </div>
    
    <div style="height: 20px;"></div>
    
    <image scr="images\Näyttökuva 2025-11-01 205803.png" alt="Responsive Image" class="responsive-image"
    
    <div style="height: 20px;"></div>
    
    <div class="media-query-box">Resize the window to see the effect</div>
    
    <div style="height: 20px;"></div>
    
    <nav class="responsive-nav">
      <button class="menu-toggle">☰ Menu</button>
      <ul class="nav-list">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

</body>
</html>
